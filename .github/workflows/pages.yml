name: Publish Atlas demo
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build demo
        run: |
          npm install
          npm run build
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Allow the artifact service to index the newly uploaded pages bundle.
      # Re-running this job is not safe if it creates duplicate github-pages artifacts.
      - name: Wait for artifact indexing
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
